name: Build Windows Installer (Light - First Launch Download)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build backend (PyInstaller)
        run: python scripts\build_backend.py

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Download VC++ Runtime Redistributable (x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop\prereqs | Out-Null
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "desktop\prereqs\vc_redist.x64.exe"

      - name: Build Windows installer (light - no bundled models)
        working-directory: desktop
        run: npm run build:win

      - name: Upload Windows light installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-light
          path: |
            desktop\dist\*.exe
            desktop\dist\*.blockmap
          if-no-files-found: error
