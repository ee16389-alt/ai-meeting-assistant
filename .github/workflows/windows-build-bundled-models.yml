name: Build Windows Installer (Bundled Models)

on:
  workflow_dispatch:
    inputs:
      gguf_url:
        description: "Direct download URL for GGUF model (.gguf)"
        required: true
      sherpa_zip_url:
        description: "Direct download URL for sherpa-onnx model zip"
        required: true

jobs:
  build:
    runs-on: windows-latest
    env:
      EMBED_SHERPA_ONNX: "0"
      PYINSTALLER_MODE: "onedir"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BUNDLE_GGUF: "1"
      BUNDLE_SHERPA_MODELS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Install all deps except llama-cpp-python first
          $reqs = Get-Content requirements.txt | Where-Object { $_ -and ($_ -notmatch '^\s*llama') }
          if ($reqs) { python -m pip install @reqs }
          python -m pip install pyinstaller gdown
          # Build llama-cpp-python from source without AVX/AVX2 for maximum CPU compatibility
          # --no-binary forces source build so CMAKE_ARGS are actually applied
          $env:CMAKE_ARGS = "-DLLAMA_AVX=OFF -DLLAMA_AVX2=OFF -DLLAMA_F16C=OFF -DLLAMA_FMA=OFF"
          python -m pip install llama-cpp-python --force-reinstall --no-cache-dir --no-binary llama-cpp-python

      - name: Install NSIS
        run: choco install nsis -y

      - name: Download model assets (GGUF + Sherpa)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Download-Asset {
            param(
              [string]$Url,
              [string]$OutFile,
              [string]$Label
            )

            $Url = $Url.Trim()
            Write-Host "Downloading ${Label} from: $Url"

            $isDrive = $Url -match 'drive\.google\.com'
            if ($isDrive) {
              python -m gdown --fuzzy "$Url" -O "$OutFile"
              if ($LASTEXITCODE -ne 0) {
                throw "gdown failed for ${Label}. If this is a Google Drive file, set sharing to 'Anyone with the link (Viewer)' and use a direct URL."
              }
            } else {
              $tmpUrl = [uri]::new($Url).AbsoluteUri
              Write-Host "Resolved URI: $tmpUrl"
              curl.exe -L --retry 3 --retry-delay 5 -o "$OutFile" $tmpUrl
              if ($LASTEXITCODE -ne 0) {
                throw "curl failed for ${Label} (exit $LASTEXITCODE)"
              }
            }

            if (-not (Test-Path $OutFile)) {
              throw "Download failed for ${Label}: file not found at ${OutFile}"
            }
            $size = (Get-Item $OutFile).Length
            if ($size -le 0) {
              throw "Download failed for ${Label}: file is empty (${OutFile})"
            }
            Write-Host "Downloaded ${Label} -> ${OutFile} (${size} bytes)"
          }

          New-Item -ItemType Directory -Force -Path models\llm | Out-Null
          New-Item -ItemType Directory -Force -Path models\sherpa-onnx | Out-Null

          $cfg = Get-Content desktop\model_pack_config.json | ConvertFrom-Json
          $ggufFilename = $cfg.ggufFilename

          Download-Asset -Url "${{ inputs.gguf_url }}" -OutFile "models\llm\$ggufFilename" -Label "GGUF"
          Download-Asset -Url "${{ inputs.sherpa_zip_url }}" -OutFile "models\sherpa-onnx.zip" -Label "Sherpa zip"
          Expand-Archive -Path models\sherpa-onnx.zip -DestinationPath models\sherpa-onnx -Force

          $expectedName = $cfg.sherpaModelDirName
          $expectedDir = Join-Path "models\sherpa-onnx" $expectedName
          if (-not (Test-Path $expectedDir)) {
            $matches = Get-ChildItem -Path "models\sherpa-onnx" -Directory -Recurse |
              Where-Object { $_.Name -eq $expectedName -and $_.FullName -notmatch '[\\/]+__MACOSX([\\/]|$)' }
            if ($matches.Count -eq 1) {
              $src = $matches[0].FullName
              Move-Item -Path $src -Destination $expectedDir -Force
              Write-Host "Normalized Sherpa dir: $src -> $expectedDir"
            } else {
              throw "Could not uniquely locate expected Sherpa model dir: $expectedName"
            }
          }

      - name: Validate downloaded model structure
        shell: pwsh
        run: |
          $cfg = Get-Content desktop\model_pack_config.json | ConvertFrom-Json
          $ggufPath = "models\llm\$($cfg.ggufFilename)"
          $sherpaDir = "models\sherpa-onnx\$($cfg.sherpaModelDirName)"
          if (-not (Test-Path $ggufPath)) { throw "Missing GGUF: $ggufPath" }
          if (-not (Test-Path $sherpaDir)) { throw "Missing sherpa dir: $sherpaDir" }
          Write-Host "GGUF OK: $ggufPath"
          Write-Host "Sherpa dir OK: $sherpaDir"

      - name: Prepare desktop assets (copy models into desktop/)
        run: |
          python scripts\prepare_desktop_assets.py --include-sherpa

      - name: Build backend (PyInstaller)
        run: |
          python scripts\build_backend.py

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Download VC++ Runtime Redistributable (x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop\prereqs | Out-Null
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "desktop\prereqs\vc_redist.x64.exe"
          if (-not (Test-Path "desktop\prereqs\vc_redist.x64.exe")) {
            throw "Failed to download vc_redist.x64.exe"
          }
          $size = (Get-Item "desktop\prereqs\vc_redist.x64.exe").Length
          if ($size -le 0) {
            throw "Downloaded vc_redist.x64.exe is empty"
          }
          Write-Host "VC++ runtime downloaded: $size bytes"

      - name: Build Windows installer (bundled GGUF + Sherpa)
        working-directory: desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $env:BUNDLE_GGUF = "1"
          $env:BUNDLE_SHERPA_MODELS = "1"
          npm run build:win

      - name: Build Windows unpacked app (bundled GGUF + Sherpa)
        working-directory: desktop
        shell: pwsh
        run: |
          $env:BUNDLE_GGUF = "1"
          $env:BUNDLE_SHERPA_MODELS = "1"
          npm run build:win:dir

      - name: Smoke test bundled backend health endpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resources = Resolve-Path "desktop\dist\win-unpacked\resources"
          $backend = Resolve-Path "desktop\dist\win-unpacked\resources\backend\ai_meeting_backend.exe"
          if (-not (Test-Path $backend)) {
            throw "Bundled backend exe not found: $backend"
          }

          $compatModels = Join-Path $resources "backend\_internal\models"
          $modelsDir = Join-Path $resources "models"
          if ((Test-Path $modelsDir) -and -not (Test-Path $compatModels)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $compatModels -Parent) | Out-Null
            try {
              New-Item -ItemType Junction -Path $compatModels -Target $modelsDir | Out-Null
              Write-Host "Created models compatibility junction: $compatModels -> $modelsDir"
            } catch {
              Copy-Item -Path $modelsDir -Destination $compatModels -Recurse -Force
              Write-Host "Copied models compatibility dir: $compatModels"
            }
          }

          Write-Host "Bundled resources layout:"
          Get-ChildItem -Path $resources -Depth 2 | Select-Object FullName

          $stdoutLog = Join-Path $env:RUNNER_TEMP "backend-stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "backend-stderr.log"
          if (Test-Path $stdoutLog) { Remove-Item $stdoutLog -Force }
          if (Test-Path $stderrLog) { Remove-Item $stderrLog -Force }

          $proc = Start-Process `
            -FilePath $backend `
            -WorkingDirectory (Split-Path $backend -Parent) `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 1000
              try {
                $client = New-Object System.Net.Sockets.TcpClient
                $iar = $client.BeginConnect("127.0.0.1", 8000, $null, $null)
                if ($iar.AsyncWaitHandle.WaitOne(1200, $false) -and $client.Connected) {
                  $client.EndConnect($iar)
                  Write-Host "Backend health check passed (TCP 127.0.0.1:8000 is reachable)."
                  $ready = $true
                  $client.Close()
                  break
                }
                $client.Close()
              } catch {
                Write-Host "TCP health probe not ready yet."
              }
              if ($proc.HasExited) {
                if (Test-Path $stdoutLog) {
                  Write-Host "backend stdout:"
                  Get-Content $stdoutLog
                }
                if (Test-Path $stderrLog) {
                  Write-Host "backend stderr:"
                  Get-Content $stderrLog
                }
                throw "Bundled backend exited early with code $($proc.ExitCode)"
              }
            }

            if (-not $ready) {
              if ($proc.HasExited) {
                if (Test-Path $stdoutLog) {
                  Write-Host "backend stdout:"
                  Get-Content $stdoutLog
                }
                if (Test-Path $stderrLog) {
                  Write-Host "backend stderr:"
                  Get-Content $stderrLog
                }
                throw "Bundled backend exited before becoming healthy. Exit code: $($proc.ExitCode)"
              }
              if (Test-Path $stdoutLog) {
                Write-Host "backend stdout:"
                Get-Content $stdoutLog
              }
              if (Test-Path $stderrLog) {
                Write-Host "backend stderr:"
                Get-Content $stderrLog
              }
              throw "Bundled backend did not become healthy within timeout."
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Upload Windows bundled installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-bundled-models
          path: |
            desktop\dist\*.exe
            desktop\dist\*.blockmap
          if-no-files-found: warn

      - name: Upload Windows unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: windows-unpacked-bundled-models
          path: desktop\dist\win-unpacked\**
          if-no-files-found: error
